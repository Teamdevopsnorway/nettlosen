<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>100 Day Powerlist — Walter Cobb</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #161616;
      --border: #2a2a2a;
      --accent: #f5a623;
      --accent2: #e8451a;
      --green: #22c55e;
      --text: #f0f0f0;
      --muted: #888;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 80px;
      -webkit-text-size-adjust: 100%;
    }
    header { text-align: center; margin-bottom: 28px; }
    .brand { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    h1 { font-size: clamp(24px, 6vw, 40px); font-weight: 800; line-height: 1.1; }

    /* Goal banner */
    .goal-banner {
      background: linear-gradient(135deg, #1a1000 0%, #1a0800 100%);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin: 0 auto 20px;
      max-width: 640px;
      text-align: center;
    }
    .goal-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .goal-text { font-size: 19px; font-weight: 700; }

    /* Quote of day */
    .quote-box {
      background: #130000;
      border: 1px solid var(--accent2);
      border-left: 4px solid var(--accent2);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin: 0 auto 22px;
      max-width: 640px;
    }
    .q-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent2); margin-bottom: 8px; }
    .q-text { font-size: clamp(14px, 3.5vw, 17px); font-weight: 700; font-style: italic; line-height: 1.45; color: #f5f5f5; }
    .q-date { font-size: 11px; color: var(--muted); margin-top: 8px; }

    /* Stats */
    .stats-section { max-width: 640px; margin: 0 auto 24px; }
    .stats-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .stats-label { font-size: 13px; color: var(--muted); }
    .stats-count { font-size: 26px; font-weight: 800; color: var(--accent); }
    .stats-sub { font-size: 12px; color: var(--muted); }
    .progress-bar { height: 7px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 14px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 99px; transition: width 0.4s; }
    .pill-row { display: flex; gap: 10px; }
    .pill { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .pill .val { font-size: 20px; font-weight: 800; color: var(--accent); }
    .pill .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    /* Day grid */
    .days-grid { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

    .day-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .day-card.is-today { border-color: var(--accent); }
    .day-card.is-perfect { border-color: var(--green); }
    .day-card.is-future { opacity: 0.35; pointer-events: none; }

    .day-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .day-num { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); min-width: 44px; }
    .day-title { flex: 1; font-size: 14px; font-weight: 600; }
    .today-pill { display: inline-block; font-size: 10px; background: var(--accent); color: #000; padding: 2px 7px; border-radius: 4px; margin-left: 6px; font-weight: 800; letter-spacing: 1px; }
    .day-badge { font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 700; white-space: nowrap; }
    .b-perfect { background: #14532d; color: var(--green); }
    .b-partial  { background: #2c1a00; color: var(--accent); }
    .b-missed   { background: #2a0a0a; color: #ef4444; }
    .b-today    { background: #1a0d00; color: var(--accent); border: 1px solid var(--accent); }
    .b-future   { background: var(--border); color: var(--muted); }
    .chevron { font-size: 11px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
    .day-card.open .chevron { transform: rotate(180deg); }

    /* Tasks */
    .tasks-wrap { display: none; border-top: 1px solid var(--border); padding: 0 14px 14px; }
    .day-card.open .tasks-wrap { display: block; }

    .day-quote-strip {
      margin: 12px 0 8px;
      padding: 10px 12px;
      background: #100000;
      border-left: 3px solid var(--accent2);
      border-radius: 6px;
    }
    .day-quote-strip p { font-size: 12px; font-style: italic; color: #bbb; line-height: 1.4; }

    .task-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }
    .task-row:last-child { border-bottom: none; }
    .task-icon { font-size: 18px; flex-shrink: 0; }
    .task-body { flex: 1; }
    .task-name { font-size: 14px; font-weight: 600; }
    .task-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .task-row.done .task-name { text-decoration: line-through; color: var(--muted); }

    /* THE CHECK BUTTON */
    .check-btn {
      flex-shrink: 0;
      min-width: 80px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 2px solid #555;
      background: #252525;
      color: #ddd;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.15s;
      touch-action: manipulation;
    }
    .check-btn:active { transform: scale(0.95); }
    .task-row.done .check-btn {
      background: var(--green);
      border-color: var(--green);
      color: #000;
    }

    /* Win message */
    .win-msg { display: none; text-align: center; padding: 12px; font-size: 15px; font-weight: 800; color: var(--green); }

    /* Reset */
    .reset-btn {
      display: block;
      margin: 36px auto 0;
      background: none;
      border: 1px solid #333;
      color: var(--muted);
      padding: 9px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s;
      touch-action: manipulation;
    }
    .reset-btn:hover, .reset-btn:active { border-color: #ef4444; color: #ef4444; }

    .safari-tip {
      max-width: 640px;
      margin: 16px auto 0;
      text-align: center;
      font-size: 11px;
      color: #555;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">Walter Cobb</div>
  <h1>100 Day Powerlist</h1>
</header>

<div class="goal-banner">
  <div class="goal-label">Main Goal</div>
  <div class="goal-text">Buy a House &amp; Provide for My Family</div>
</div>

<div class="quote-box" id="quoteBox">
  <div class="q-label">🔥 Day <span id="qDayNum">1</span> — Truth of the Day</div>
  <div class="q-text" id="qText">Loading...</div>
  <div class="q-date" id="qDate"></div>
</div>

<div class="stats-section">
  <div class="stats-header">
    <span class="stats-label">Overall Progress</span>
    <span>
      <span class="stats-count" id="daysCompleted">0</span>

    </span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="pill-row">
    <div class="pill"><div class="val" id="streakVal">0</div><div class="lbl">Streak</div></div>
    <div class="pill"><div class="val" id="bestStreakVal">0</div><div class="lbl">Best</div></div>
    <div class="pill"><div class="val" id="todayCount">0/4</div><div class="lbl">Today</div></div>
  </div>
</div>

<div class="win-msg" id="winMsg">All 4 done today. Let's go! 🔥</div>
<div class="days-grid" id="daysGrid"></div>

<button class="reset-btn" id="resetBtn">Reset All Progress</button>
<p class="safari-tip">Tip: Open in Safari to save progress between sessions.</p>

<script>
// ── Safe storage (works even when localStorage is blocked) ────────────────
const store = (() => {
  const mem = {};
  let ok = false;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); ok = true; } catch (_) {}
  return {
    get(k)    { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(_) { return mem[k] ?? null; } },
    set(k, v) { try { if (ok) localStorage.setItem(k, v); else mem[k] = v; } catch(_) { mem[k] = v; } },
    del(k)    { try { if (ok) localStorage.removeItem(k); else delete mem[k]; } catch(_) { delete mem[k]; } }
  };
})();

// ── Constants ──────────────────────────────────────────────────────────────
const STORE_STATE = 'pl_state_v2';
const STORE_START = 'pl_start_v2';
const TOTAL = 100;

const TASKS = [

  { id: 'train', icon: '💪', name: 'Train 45 Minutes',            desc: 'No excuses — 45 min minimum' },

const QUOTES = [

  "The algorithm doesn't care about your mood. Post anyway.",

  "Day 84. If it were easy, everyone would do it. It's not. Do it anyway.",

  "Day 94. The man you were 94 days ago would not believe you.",
  "Day 95. Five percent left. Finish like you mean it.",
  "Day 96. Anyone can start. Only the serious finish.",
  "Day 97. Three days from 100. What kind of man finishes strong?",
  "Day 98. The man you were 98 days ago is watching. Don't let him down.",
  "Day 99. One day left. You do not coast to the finish line. You sprint.",
  "Day 100. You did it. Now prove it wasn't a phase — start Day 1 again."
];

// ── Date helpers (timezone-safe) ───────────────────────────────────────────
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function msForDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return Date.UTC(y, m - 1, d);
}

function daysBetween(a, b) {
  return Math.round((msForDate(b) - msForDate(a)) / 86400000);
}

function addDays(dateStr, n) {
  const ms = msForDate(dateStr) + n * 86400000;
  const d = new Date(ms);
  return d.getUTCFullYear() + '-' +
    String(d.getUTCMonth() + 1).padStart(2, '0') + '-' +
    String(d.getUTCDate()).padStart(2, '0');
}

function fmtDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d)).toLocaleDateString('en-GB', {
    weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC'
  });
}

// ── State ──────────────────────────────────────────────────────────────────
function getStartDate() {
  let d = store.get(STORE_START);
  if (!d) { d = todayStr(); store.set(STORE_START, d); }
  return d;
}

function loadState() {
  try { return JSON.parse(store.get(STORE_STATE)) || {}; } catch(_) { return {}; }
}

function saveState(s) {
  try { store.set(STORE_STATE, JSON.stringify(s)); } catch(_) {}
}

function isPerfect(d) { return d && TASKS.every(t => d[t.id]); }
function doneCount(d) { return d ? TASKS.filter(t => d[t.id]).length : 0; }

// ── Toggle task ────────────────────────────────────────────────────────────
function toggleTask(dateStr, taskId) {
  const state = loadState();
  if (!state[dateStr]) state[dateStr] = {};
  state[dateStr][taskId] = !state[dateStr][taskId];
  saveState(state);
  render();
}

function toggleCard(el) {
  el.closest('.day-card').classList.toggle('open');
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const state    = loadState();
  const start    = getStartDate();
  const today    = todayStr();
  const todayIdx = Math.min(Math.max(daysBetween(start, today), 0), TOTAL - 1);

  // Quote
  const q = QUOTES[Math.min(todayIdx, QUOTES.length - 1)];
  document.getElementById('qDayNum').textContent = todayIdx + 1;
  document.getElementById('qText').textContent   = '“' + q + '”';
  document.getElementById('qDate').textContent   = fmtDate(today);

  // Stats
  let perfect = 0, cur = 0, best = 0;
  for (let i = 0; i <= todayIdx; i++) {
    const p = isPerfect(state[addDays(start, i)]);
    if (p) { perfect++; cur++; if (cur > best) best = cur; } else { cur = 0; }
  }
  // streak = current run ending yesterday if today not yet perfect
  const todayDone = doneCount(state[today]);
  if (!isPerfect(state[today])) { let s = 0; for (let i = 0; i < todayIdx; i++) { s = isPerfect(state[addDays(start, i)]) ? s + 1 : 0; } cur = s; }

  document.getElementById('daysCompleted').textContent  = perfect;
  document.getElementById('progressFill').style.width   = perfect + '%';
  document.getElementById('streakVal').textContent      = cur;
  document.getElementById('bestStreakVal').textContent  = best;
  document.getElementById('todayCount').textContent     = todayDone + '/4';

  const winMsg = document.getElementById('winMsg');
  winMsg.style.display = todayDone === 4 ? 'block' : 'none';

  // Cards
  const grid = document.getElementById('daysGrid');
  const openSet = new Set([...grid.querySelectorAll('.day-card.open')].map(c => c.dataset.idx));
  grid.innerHTML = '';

  for (let i = 0; i < TOTAL; i++) {
    const dateStr  = addDays(start, i);
    const isToday  = i === todayIdx;
    const isFuture = i > todayIdx;
    const dayData  = state[dateStr] || {};
    const done     = doneCount(dayData);
    const perf     = isPerfect(dayData);

    let bClass, bText;
    if (isFuture)        { bClass = 'b-future';  bText = 'Upcoming'; }
    else if (isToday)    { bClass = 'b-today';   bText = done === 4 ? '🔥 Perfect' : done + '/4 done'; }
    else if (perf)       { bClass = 'b-perfect'; bText = '✓ Perfect'; }
    else if (done > 0)   { bClass = 'b-partial'; bText = done + '/4'; }
    else                 { bClass = 'b-missed';  bText = 'Missed'; }

    const shouldOpen = isToday || openSet.has(String(i));

    const card = document.createElement('div');
    card.className = ['day-card', isToday ? 'is-today' : '', perf && !isFuture ? 'is-perfect' : '', isFuture ? 'is-future' : '', shouldOpen ? 'open' : ''].filter(Boolean).join(' ');
    card.dataset.idx = i;

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'day-header';
    hdr.onclick = () => card.classList.toggle('open');
    hdr.innerHTML =
      '<span class="day-num">Day ' + (i + 1) + '</span>' +
      '<span class="day-title">' + fmtDate(dateStr) + (isToday ? '<span class="today-pill">TODAY</span>' : '') + '</span>' +
      '<span class="day-badge ' + bClass + '">' + bText + '</span>' +
      '<span class="chevron">&#9660;</span>';

    // Tasks wrapper
    const wrap = document.createElement('div');
    wrap.className = 'tasks-wrap';

    // Quote strip
    const qs = document.createElement('div');
    qs.className = 'day-quote-strip';
    const qp = document.createElement('p');
    qp.textContent = '“' + QUOTES[Math.min(i, QUOTES.length - 1)] + '”';
    qs.appendChild(qp);
    wrap.appendChild(qs);

    // Task rows
    TASKS.forEach(function(task) {
      const checked = !!dayData[task.id];
      const row = document.createElement('div');
      row.className = 'task-row' + (checked ? ' done' : '');

      const icon = document.createElement('span');
      icon.className = 'task-icon';
      icon.textContent = task.icon;

      const body = document.createElement('div');
      body.className = 'task-body';
      const nm = document.createElement('div');
      nm.className = 'task-name';
      nm.textContent = task.name;
      const dc = document.createElement('div');
      dc.className = 'task-desc';
      dc.textContent = task.desc;
      body.appendChild(nm);
      body.appendChild(dc);

      const btn = document.createElement('button');
      btn.className = 'check-btn';
      btn.textContent = checked ? '✓ Done' : 'Check off';
      btn.onclick = (function(ds, tid) {
        return function(e) { e.stopPropagation(); toggleTask(ds, tid); };
      })(dateStr, task.id);

      row.appendChild(icon);
      row.appendChild(body);
      row.appendChild(btn);
      wrap.appendChild(row);
    });

    card.appendChild(hdr);
    card.appendChild(wrap);
    grid.appendChild(card);
  }

  // Scroll today's card into view on first render
  const todayCard = grid.querySelector('.is-today');
  if (todayCard && !grid.dataset.scrolled) {
    grid.dataset.scrolled = '1';
    setTimeout(function() { todayCard.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
  }
}

// ── Reset ──────────────────────────────────────────────────────────────────
document.getElementById('resetBtn').addEventListener('click', function() {
  if (confirm('Reset ALL progress? This cannot be undone.')) {
    store.del(STORE_STATE);
    store.del(STORE_START);
    render();
  }
});

// ── Boot ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
