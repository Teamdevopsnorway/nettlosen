<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>100 Day Powerlist — Walter Cobb</title>
  <style>
    :root {
      --bg:#0d0d0d; --card:#1a1a1a; --border:#2e2e2e;
      --accent:#f5a623; --red:#e8451a; --green:#22c55e;
      --text:#f0f0f0; --muted:#777; --r:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{
      background:var(--bg); color:var(--text);
      font-family:-apple-system,'Segoe UI',sans-serif;
      padding:20px 14px 80px;
      -webkit-text-size-adjust:100%;
    }

    /* ── Header ── */
    .brand{text-align:center;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
    h1{text-align:center;font-size:clamp(22px,6vw,38px);font-weight:900;margin-bottom:20px;}

    /* ── Goal ── */
    .goal{
      background:linear-gradient(135deg,#1a1000,#160800);
      border:1px solid var(--accent); border-radius:var(--r);
      padding:16px 18px; text-align:center; margin-bottom:16px;
    }
    .goal small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
    .goal strong{display:block;font-size:18px;font-weight:800;margin-top:4px;}

    /* ── Quote ── */
    .quote{
      background:#110000; border-left:4px solid var(--red);
      border-radius:var(--r); padding:14px 16px; margin-bottom:20px;
    }
    .quote .day-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:6px;}
    .quote .txt{font-size:clamp(13px,3.5vw,16px);font-style:italic;font-weight:700;line-height:1.5;color:#eee;}

    /* ── Stats ── */
    .stats{margin-bottom:20px;}
    .bar-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;}
    .bar-row strong{font-size:22px;font-weight:900;color:var(--accent);}
    .bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:12px;}
    .bar-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--accent));border-radius:99px;transition:width .4s;}
    .pills{display:flex;gap:8px;}
    .pill{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center;}
    .pill .v{font-size:20px;font-weight:900;color:var(--accent);}
    .pill .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}

    /* ── Today section ── */
    .section-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

    .today-card{
      background:var(--card); border:2px solid var(--accent);
      border-radius:var(--r); overflow:hidden; margin-bottom:20px;
    }
    .today-card-hdr{
      background:linear-gradient(135deg,#201000,#180800);
      padding:12px 16px; display:flex; justify-content:space-between; align-items:center;
    }
    .today-card-hdr .date{font-size:14px;font-weight:700;}
    .today-card-hdr .badge{font-size:11px;font-weight:800;color:#000;background:var(--accent);padding:3px 10px;border-radius:99px;}

    .win-banner{
      display:none; background:#052e16; border-bottom:1px solid var(--green);
      padding:10px 16px; text-align:center;
      font-size:14px; font-weight:800; color:var(--green);
    }

    /* ── Task row ── */
    .task{
      display:flex; align-items:center; gap:10px;
      padding:14px 16px; border-bottom:1px solid var(--border);
    }
    .task:last-child{border-bottom:none;}
    .task .ico{font-size:22px;flex-shrink:0;}
    .task .info{flex:1;}
    .task .name{font-size:14px;font-weight:700;}
    .task .desc{font-size:11px;color:var(--muted);margin-top:2px;}
    .task.done .name{text-decoration:line-through;color:var(--muted);}

    .chk{
      flex-shrink:0; min-width:90px; padding:11px 16px;
      background:#252525; border:2px solid #555;
      border-radius:10px; color:#ccc;
      font-size:14px; font-weight:900;
      cursor:pointer; text-align:center;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      transition:all .15s;
    }
    .chk:active{transform:scale(0.93);}
    .task.done .chk{background:var(--green);border-color:var(--green);color:#000;}

    /* ── History ── */
    .history-toggle{
      width:100%; padding:12px 16px;
      background:var(--card); border:1px solid var(--border);
      border-radius:var(--r); color:var(--muted);
      font-size:13px; font-weight:700; cursor:pointer;
      text-align:left; margin-bottom:10px;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .history-list{display:none;flex-direction:column;gap:8px;margin-bottom:20px;}
    .history-list.open{display:flex;}

    .hist-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
    .hist-card.perf{border-color:var(--green);}
    .hist-hdr{
      display:flex; align-items:center; gap:10px;
      padding:11px 14px; cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .hist-hdr .dn{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);min-width:42px;}
    .hist-hdr .dt{flex:1;font-size:14px;font-weight:600;}
    .hist-hdr .hbadge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;}
    .hb-perf{background:#14532d;color:var(--green);}
    .hb-part{background:#2c1a00;color:var(--accent);}
    .hb-miss{background:#2a0a0a;color:#ef4444;}
    .hist-tasks{display:none;border-top:1px solid var(--border);padding:10px 14px;}
    .hist-card.open .hist-tasks{display:block;}
    .hist-task-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
    .hist-task-row:last-child{border-bottom:none;}
    .hist-task-row .ico{font-size:16px;flex-shrink:0;}
    .hist-task-row .nm{flex:1;font-size:13px;font-weight:600;}
    .hist-task-row.done .nm{text-decoration:line-through;color:var(--muted);}
    .hist-chk{
      flex-shrink:0; min-width:80px; padding:8px 12px;
      background:#252525; border:2px solid #555;
      border-radius:8px; color:#ccc;
      font-size:12px; font-weight:800;
      cursor:pointer; text-align:center;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .hist-task-row.done .hist-chk{background:var(--green);border-color:var(--green);color:#000;}

    /* ── Reset ── */
    .reset{
      display:block; margin:30px auto 0;
      background:none; border:1px solid #333; color:var(--muted);
      padding:9px 22px; border-radius:8px; cursor:pointer;
      font-size:13px; touch-action:manipulation;
    }
    .reset:active{border-color:#ef4444;color:#ef4444;}
    .tip{text-align:center;font-size:11px;color:#444;margin-top:10px;}
  </style>
</head>
<body>

<div class="brand">Walter Cobb</div>
<h1>100 Day Powerlist</h1>

<div class="goal">
  <small>Main Goal</small>
  <strong>Buy a House &amp; Provide for My Family</strong>
</div>

<div class="quote" id="quoteBox">
  <div class="day-lbl">🔥 Day <span id="qDay">1</span> — Truth of the Day</div>
  <div class="txt" id="qTxt">Loading…</div>
</div>

<div class="stats">
  <div class="bar-row">
    <span>Overall Progress</span>
    <span><strong id="sPerfect">0</strong> / 100 perfect days</span>
  </div>
  <div class="bar"><div class="bar-fill" id="sBar" style="width:0%"></div></div>
  <div class="pills">
    <div class="pill"><div class="v" id="sStreak">0</div><div class="l">Streak</div></div>
    <div class="pill"><div class="v" id="sBest">0</div><div class="l">Best</div></div>
    <div class="pill"><div class="v" id="sToday">0/4</div><div class="l">Today</div></div>
  </div>
</div>

<p class="section-title">Today's Powerlist</p>

<div class="today-card" id="todayCard">
  <div class="today-card-hdr">
    <span class="date" id="todayDate">—</span>
    <span class="badge" id="todayBadge">0/4 done</span>
  </div>
  <div class="win-banner" id="winBanner">All 4 done today. Let's go! 🔥</div>
  <div id="todayTasks"></div>
</div>

<button class="history-toggle" id="histToggle" onclick="toggleHistory()">📅 Show Past Days ▼</button>
<div class="history-list" id="histList"></div>

<button class="reset" onclick="doReset()">Reset All Progress</button>
<p class="tip">Open in Safari to save progress between sessions.</p>

<script>
// ── Safe storage ────────────────────────────────────────────────────────────
var _mem = {};
var _lsOk = false;
try { localStorage.setItem('__x','1'); localStorage.removeItem('__x'); _lsOk = true; } catch(e){}
var store = {
  get: function(k){ try{ return _lsOk ? localStorage.getItem(k) : (_mem[k]||null); }catch(e){ return _mem[k]||null; } },
  set: function(k,v){ try{ if(_lsOk) localStorage.setItem(k,v); else _mem[k]=v; }catch(e){ _mem[k]=v; } },
  del: function(k){ try{ if(_lsOk) localStorage.removeItem(k); else delete _mem[k]; }catch(e){ delete _mem[k]; } }
};

// ── Config ──────────────────────────────────────────────────────────────────
var SK = 'pl3_state', SD = 'pl3_start', TOTAL = 100;

  "Your habits are louder than your ambitions.",

  "Nobody wakes up at 05:00 because they feel like it. They decide to.",

  "Being tired is temporary. Being broke is optional.",
  "Accountability starts in the dark, alone, when no one is watching.",

  "The 45 minutes you skip will be the 45 minutes you regret in 10 years.",
  "Financial freedom is built, page by page, rep by rep, day by day.",

  "Day 94. The man you were 94 days ago would not believe you.",
  "Day 95. Five percent left. Finish like you mean it.",
  "Day 96. Anyone can start. Only the serious finish.",
  "Day 97. Three days from 100. What kind of man finishes strong?",
  "Day 98. The man you were 98 days ago is watching. Don't let him down.",
  "Day 99. One day left. You do not coast to the finish line. You sprint.",
  "Day 100. You did it. Now prove it wasn't a phase — start Day 1 again."

// ── Date helpers ────────────────────────────────────────────────────────────
function today(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n){ return n<10?'0'+n:''+n; }
function dateMs(s){ var p=s.split('-'); return Date.UTC(+p[0],+p[1]-1,+p[2]); }
function addDays(s,n){
  var d=new Date(dateMs(s)+n*86400000);
  return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
}
function diffDays(a,b){ return Math.round((dateMs(b)-dateMs(a))/86400000); }
function fmtDate(s){
  var p=s.split('-');
  return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]))
    .toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
}

// ── State ───────────────────────────────────────────────────────────────────
function getStart(){
  var d=store.get(SD); if(!d){ d=today(); store.set(SD,d); } return d;
}
function loadState(){ try{ return JSON.parse(store.get(SK))||{}; }catch(e){ return {}; } }
function saveState(s){ try{ store.set(SK,JSON.stringify(s)); }catch(e){} }
function isPerfect(d){ return d && TASKS.every(function(t){ return d[t.id]; }); }
function doneCount(d){ if(!d) return 0; return TASKS.filter(function(t){ return d[t.id]; }).length; }

// ── Toggle ──────────────────────────────────────────────────────────────────
function toggleTask(dateStr, taskId){
  var state=loadState();
  if(!state[dateStr]) state[dateStr]={};
  state[dateStr][taskId]=!state[dateStr][taskId];
  saveState(state);
  render();
}

// ── History toggle ──────────────────────────────────────────────────────────
function toggleHistory(){
  var list=document.getElementById('histList');
  var btn=document.getElementById('histToggle');
  if(list.classList.contains('open')){
    list.classList.remove('open');
    btn.textContent='📅 Show Past Days ▼';
  } else {
    list.classList.add('open');
    btn.textContent='📅 Hide Past Days ▲';
  }
}

// ── Render ──────────────────────────────────────────────────────────────────
function render(){
  var state = loadState();
  var start = getStart();
  var td    = today();
  var idx   = Math.max(0, Math.min(diffDays(start, td), TOTAL-1));

  // Quote
  var q = QUOTES[Math.min(idx, QUOTES.length-1)];
  document.getElementById('qDay').textContent = idx+1;
  document.getElementById('qTxt').textContent = '“'+q+'”';

  // Stats
  var perfect=0, cur=0, best=0;
  for(var i=0;i<=idx;i++){
    var p=isPerfect(state[addDays(start,i)]);
    if(p){ perfect++; cur++; if(cur>best) best=cur; } else { cur=0; }
  }
  var todayDone=doneCount(state[td]);
  if(!isPerfect(state[td])){ var s=0; for(var i=0;i<idx;i++){ s=isPerfect(state[addDays(start,i)])?s+1:0; } cur=s; }

  document.getElementById('sPerfect').textContent = perfect;
  document.getElementById('sBar').style.width     = perfect+'%';
  document.getElementById('sStreak').textContent  = cur;
  document.getElementById('sBest').textContent    = best;
  document.getElementById('sToday').textContent   = todayDone+'/4';

  // Today card
  document.getElementById('todayDate').textContent  = 'Day '+(idx+1)+' — '+fmtDate(td);
  document.getElementById('todayBadge').textContent = todayDone===4?'🔥 Perfect!':todayDone+'/4 done';
  document.getElementById('winBanner').style.display = todayDone===4?'block':'none';

  var tasksCont = document.getElementById('todayTasks');
  tasksCont.innerHTML = '';
  TASKS.forEach(function(task){
    var done = !!(state[td] && state[td][task.id]);
    var row  = document.createElement('div');
    row.className = 'task'+(done?' done':'');

    var ico=document.createElement('span'); ico.className='ico'; ico.textContent=task.ico;
    var inf=document.createElement('div');  inf.className='info';
    var nm=document.createElement('div');   nm.className='name'; nm.textContent=task.name;
    var dc=document.createElement('div');   dc.className='desc'; dc.textContent=task.desc;
    inf.appendChild(nm); inf.appendChild(dc);

    var btn=document.createElement('button'); btn.className='chk';
    btn.textContent=done?'✓ Done':'Check off';
    (function(ds,tid){ btn.onclick=function(){ toggleTask(ds,tid); }; })(td, task.id);

    row.appendChild(ico); row.appendChild(inf); row.appendChild(btn);
    tasksCont.appendChild(row);
  });

  // History (past days only)
  var histList = document.getElementById('histList');
  var wasOpen  = histList.classList.contains('open');
  histList.innerHTML = '';
  if(wasOpen) histList.classList.add('open');

  for(var i=idx-1;i>=0;i--){
    var ds      = addDays(start, i);
    var dayData = state[ds]||{};
    var dn      = doneCount(dayData);
    var perf    = isPerfect(dayData);

    var hc = document.createElement('div');
    hc.className = 'hist-card'+(perf?' perf':'');

    var bClass = perf?'hb-perf': dn>0?'hb-part':'hb-miss';
    var bText  = perf?'✓ Perfect': dn>0?dn+'/4':'Missed';

    var hh = document.createElement('div'); hh.className='hist-hdr';
    hh.innerHTML = '<span class="dn">Day '+(i+1)+'</span>'+
                   '<span class="dt">'+fmtDate(ds)+'</span>'+
                   '<span class="hbadge '+bClass+'">'+bText+'</span>';
    (function(card){ hh.onclick=function(){ card.classList.toggle('open'); }; })(hc);

    var ht = document.createElement('div'); ht.className='hist-tasks';
    TASKS.forEach(function(task){
      var done = !!(dayData[task.id]);
      var r=document.createElement('div'); r.className='hist-task-row'+(done?' done':'');
      var ico=document.createElement('span'); ico.className='ico'; ico.textContent=task.ico;
      var nm=document.createElement('div');  nm.className='nm';  nm.textContent=task.name;
      var btn=document.createElement('button'); btn.className='hist-chk';
      btn.textContent=done?'✓ Done':'Check off';
      (function(ds2,tid){ btn.onclick=function(){ toggleTask(ds2,tid); }; })(ds, task.id);
      r.appendChild(ico); r.appendChild(nm); r.appendChild(btn);
      ht.appendChild(r);
    });

    hc.appendChild(hh); hc.appendChild(ht);
    histList.appendChild(hc);
  }

  var histBtn = document.getElementById('histToggle');
  histBtn.style.display = idx>0?'block':'none';
}

// ── Reset ───────────────────────────────────────────────────────────────────
function doReset(){
  if(confirm('Reset ALL progress? This cannot be undone.')){
    store.del(SK); store.del(SD); render();
  }
}

render();
</script>
</body>
</html>
